<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>eco loop · laboratorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Syne:wght@700;800&display=swap">
<style>
  :root {
    --paper: #ECEEF3; --paper-2: #E1E4EC; --ink: #14161D; --muted: #5B6172; --rule: #C6CBD7;
    --a: #2346E0; --a-soft: #D5DCFA; --b: #A86C00; --b-soft: #F1E1BF; --alerta: #C0392B;
    --display: "Syne", "Arial Black", sans-serif;

    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark;
      --paper: #0F1117; --paper-2: #171A23; --ink: #E6E8EF; --muted: #8B91A2; --rule: #2A2F3C;
      --a: #8299FF; --a-soft: #1C2550; --b: #E6AE48; --b-soft: #3B2D10; --alerta: #FF7A6B; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--serif); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  button, select, input { font-family: var(--mono); font-size: 12.5px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }

  /* ---------- Preparación del ensayo ---------- */
  header { border-bottom: 2px solid var(--ink); padding: 12px 20px 10px; display: grid; gap: 10px; }
  .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .marca { font: 800 22px/1 var(--display); letter-spacing: -.02em; }
  .marca span { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
  .modos { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; gap: 2px; }
  .modos button { background: none; border: 0; color: var(--muted); padding: 5px 13px; border-radius: 999px; }
  .modos button:hover:not(:disabled) { color: var(--ink); }
  .modos button.on { background: var(--ink); color: var(--paper); }
  .modos button:disabled { cursor: default; }
  .modos button:disabled:not(.on) { opacity: .4; }
  .modo-ayuda { margin: 0; color: var(--muted); font-size: 15px; font-style: italic; flex: 1; min-width: 220px; }
  .ensayo-num { font: 800 20px/1 var(--display); }
  input, select, textarea { background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px; }
  input:disabled, select:disabled, textarea:disabled { opacity: .6; }
  #semilla, .nombre, textarea { font-family: var(--serif); font-size: 15px; }

  .setup { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 10px 18px; align-items: start; }
  @media (max-width: 900px) { .setup { grid-template-columns: 1fr 1fr; } .setup .col:first-child { grid-column: 1 / -1; } }
  @media (max-width: 600px) { .setup { grid-template-columns: 1fr; } }
  .col { display: grid; gap: 4px; min-width: 0; }
  .col > input, .col > textarea { width: 100%; }
  .etq { font-family: var(--mono); font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
  .etq small { color: var(--muted); font-size: 11px; }
  .ia-a .etq { color: var(--a); } .ia-b .etq { color: var(--b); }
  .punto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ia-a .punto { background: var(--a); } .ia-b .punto { background: var(--b); }
  .linea { display: flex; gap: 6px; min-width: 0; }
  .linea .nombre { width: 110px; flex: none; }
  .linea select { flex: 1; min-width: 0; }
  .estado-ia { margin: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .estado-ia.warn { color: var(--b); white-space: normal; }
  textarea { min-height: 44px; resize: vertical; margin-top: 2px; }
  .resumen { margin: 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .resumen b { color: var(--ink); font-weight: 500; }
  .resumen .va { color: var(--a); } .resumen .vb { color: var(--b); }
  body.en-ensayo .setup { display: none; }

  .controles { border-top: 1px solid var(--rule); padding-top: 10px; }
  .ctrl { border: 1px solid var(--ink); background: none; color: var(--ink); border-radius: 999px; padding: 7px 15px; min-height: 34px; }
  .ctrl.primario { background: var(--ink); color: var(--paper); min-width: 110px; }
  .ctrl:hover:not(:disabled) { opacity: .8; }
  .ctrl:disabled { opacity: .3; cursor: default; }
  .ajustes { display: inline-flex; flex-wrap: wrap; gap: 8px 14px; padding-left: 6px; border-left: 1px solid var(--rule); }
  .campo-h { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: help; }
  .campo-h input { width: 64px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: pointer; }
  #estado { margin-left: auto; color: var(--ink); font-family: var(--mono); font-size: 12px; }

  /* ---------- Partitura + instrumentos ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; position: relative; }
  .en-vivo { position: absolute; left: calc((100% - 300px) / 2); bottom: 18px; transform: translateX(-50%); z-index: 3;
    border: 0; border-radius: 999px; padding: 8px 16px; background: var(--ink); color: var(--paper); box-shadow: 0 4px 16px rgb(0 0 0 / .25); }
  @media (max-width: 900px) { .en-vivo { left: 50%; } }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .rail { border-left: 0; border-top: 1px solid var(--rule); } }
  #partitura { overflow-y: auto; padding: 8px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); column-gap: 8px; align-content: start; }
  .vacio { grid-column: 1 / -1; margin: 16vh auto 0; text-align: center; color: var(--muted); max-width: 44ch; display: grid; gap: 10px; }
  .vacio b { font: 800 30px/1.1 var(--display); color: var(--ink); letter-spacing: -.02em; }
  .semilla { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 12px 0 4px; }
  .semilla b { color: var(--ink); font-weight: 500; }
  .eje { grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 16px; border-inline: 1px solid var(--rule); font-family: var(--mono); color: var(--muted); }
  .eje .n { font-size: 12px; } .eje .pct { font-size: 10.5px; }
  .voz { padding: 14px 0 20px; font-size: 16.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .voz.a { grid-column: 1; } .voz.b { grid-column: 3; }
  .quien { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .voz.a .quien { color: var(--a); } .voz.b .quien { color: var(--b); }
  .quien small { color: var(--muted); letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .w-a { color: var(--a); background: var(--a-soft); border-radius: 2px; }
  .w-b { color: var(--b); background: var(--b-soft); border-radius: 2px; }
  .nota { display: block; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--alerta); border-top: 1px solid var(--rule); padding-top: 5px; white-space: normal; }
  .nota::before { content: "↳ "; }
  .nota.suave { color: var(--muted); }
  .txt { display: block; white-space: normal; }
  .txt p { margin: 0 0 .6em; } .txt p:last-child { margin-bottom: 0; }
  .txt ul, .txt ol { margin: .2em 0 .6em; padding-left: 1.3em; }
  .txt li { margin: .15em 0; } .txt li.sub { margin-left: 1.2em; list-style-type: circle; }
  .txt .md-h { font-weight: 600; margin: .8em 0 .3em; line-height: 1.3; }
  .txt .md-h1, .txt .md-h2 { font-size: 1.15em; } .txt .md-h3 { font-size: 1.05em; }
  .txt .md-h:first-child { margin-top: 0; }
  .txt hr { border: 0; border-top: 1px solid var(--rule); margin: .8em 0; }
  .txt code { font-family: var(--mono); font-size: .82em; background: var(--paper-2); padding: 1px 4px; border-radius: 3px; }
  .txt strong { font-weight: 600; }
  .cursor::after { content: "▍"; color: var(--muted); animation: parpadeo 1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  @media (max-width: 640px) {
    #partitura { grid-template-columns: 34px minmax(0, 1fr); padding-inline: 12px; }
    .eje { grid-column: 1; border-inline: 0; border-right: 1px solid var(--rule); }
    .voz.a, .voz.b { grid-column: 2; padding-left: 10px; } .voz.b { padding-left: 30px; }
  }

  .rail { border-left: 1px solid var(--rule); overflow-y: auto; padding: 16px 18px 24px; display: grid; gap: 24px; align-content: start; }
  .rail section { display: grid; gap: 8px; }
  #curva svg { width: 100%; height: auto; display: block; font-family: var(--mono); }
  #curva .g { stroke: var(--rule); }
  #curva text { fill: var(--muted); font-size: 9px; }
  .medidas { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .medidas div { background: var(--paper); padding: 8px 10px; }
  .medidas b { display: block; font: 500 19px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .medidas span { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  #alertas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--mono); font-size: 12px; }
  #alertas li { display: flex; gap: 8px; align-items: baseline; }
  #alertas li::before { content: "●"; color: var(--alerta); font-size: 10px; }
  #alertas li.nada { color: var(--muted); }
  #alertas li.nada::before { color: var(--rule); }
  #notas { width: 100%; min-height: 120px; font-family: var(--serif); font-size: 14.5px; resize: vertical; }

  /* ---------- Tira de ensayos ---------- */
  footer { border-top: 1px solid var(--rule); padding: 10px 20px 12px; display: flex; gap: 10px; overflow-x: auto; align-items: stretch; }
  .tira-cab { flex: 0 0 170px; display: grid; gap: 4px; align-content: center; }
  .tira-cab b { font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .tira-cab span { font-size: 13px; line-height: 1.35; color: var(--muted); }
  .ens { flex: 0 0 230px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .ens:hover { border-color: var(--muted); }
  .ens.activo { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .ens .rom { font: 800 20px/1 var(--display); grid-row: 1 / 5; }
  .ens .sem { font-size: 14.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ens .meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .ens .bucle { color: var(--alerta); }
  .ens .mini { display: flex; gap: 1px; align-items: flex-end; height: 20px; border-bottom: 1px solid var(--rule); }
  .ens .mini i { flex: 1; max-width: 6px; min-width: 2px; border-radius: 1px 1px 0 0; }
  .ens .mini i.a { background: var(--a); } .ens .mini i.b { background: var(--b); }
  .ens .pub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .ens .pub input { width: auto; margin: 0; }
  .ens-nuevo { flex: 0 0 auto; border: 1px dashed var(--muted); border-radius: 8px; background: none; color: var(--ink); padding: 6px 16px; font-size: 12.5px; }
  .ens-nuevo:hover { border-style: solid; }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="fila">
    <div class="marca">eco loop<span>laboratorio</span></div>
    <div class="modos" role="group" aria-label="Tipo de ensayo">
      <button type="button" data-modo="puro" class="on">Puro</button>
      <button type="button" data-modo="nombres">Nombres</button>
      <button type="button" data-modo="personalidad">Personalidad</button>
    </div>
    <p class="modo-ayuda" id="modoAyuda"></p>
    <div class="ensayo-num" id="ensayoNum">Ensayo —</div>
  </div>

  <div class="setup" id="setup">
    <div class="col">
      <label for="semilla" class="etq">Primer mensaje <small>· lo recibe la IA A</small></label>
      <input id="semilla" value="Hola">
    </div>
    <div class="col ia-a">
      <label for="modA" class="etq"><i class="punto"></i>IA A <small>· habla primero</small></label>
      <div class="linea"><input id="nomA" class="solo-nombre nombre" value="Nova" aria-label="Nombre de la IA A"><select id="modA" class="modelos"></select></div>
      <p class="estado-ia" id="chipA">Cargando modelos…</p>
      <textarea id="perA" class="solo-per" rows="2" aria-label="Personalidad de la IA A">Eres una IA curiosa y optimista. Responde en español, en 2-3 frases como máximo, y termina provocando a la otra IA.</textarea>
    </div>
    <div class="col ia-b">
      <label for="modB" class="etq"><i class="punto"></i>IA B <small>· responde a A</small></label>
      <div class="linea"><input id="nomB" class="solo-nombre nombre" value="Eco" aria-label="Nombre de la IA B"><select id="modB" class="modelos"></select></div>
      <p class="estado-ia" id="chipB">Cargando modelos…</p>
      <textarea id="perB" class="solo-per" rows="2" aria-label="Personalidad de la IA B">Eres una IA escéptica e irónica. Responde en español, en 2-3 frases como máximo, y cuestiona lo que dice la otra IA.</textarea>
    </div>
  </div>
  <p class="resumen" id="resumen" hidden></p>

  <div class="fila controles">
    <button class="ctrl primario" id="play" type="button" title="Atajo: espacio">▶ Empezar</button>
    <button class="ctrl" id="paso" type="button" title="Atajo: flecha derecha">⏭ Solo un turno</button>
    <button class="ctrl" id="pausa" type="button" title="Termina el mensaje actual y se detiene" disabled>⏸ Pausa</button>
    <button class="ctrl" id="parar" type="button" title="Corta ya; el mensaje a medias no se guarda (Esc)" disabled>■ Parar</button>
    <span class="ajustes">
      <label class="campo-h" title="Cada mensaje de una IA cuenta como un turno">Turnos <input id="turnos" type="number" value="20" min="1"></label>
      <label class="campo-h cfg-l" title="Máximo de tokens por respuesta (1 token ≈ ¾ de palabra). Si se pasa, la respuesta se corta.">Largo <input id="tokens" class="cfg" type="number" value="400" min="20" step="20"></label>
      <label class="campo-h cfg-l" title="Temperatura: 0 = predecible, 1 o más = más libre">Creatividad <input id="temp" class="cfg" type="number" value="0.8" step="0.1" min="0" max="2"></label>
    </span>
    <label class="check" title="Si una IA copia a la otra letra por letra dos veces seguidas, se detiene"><input type="checkbox" id="autoParar"> Parar si entran en bucle</label>
    <span id="estado">Listo</span>
  </div>
</header>

<main>
  <div id="partitura"></div>
  <button class="en-vivo" id="enVivo" type="button" hidden>↓ En vivo</button>
  <aside class="rail">
    <section><div class="eyebrow">Originalidad por turno</div><div id="curva"></div></section>
    <section><div class="eyebrow">Medidas</div><div class="medidas" id="medidas"></div></section>
    <section><div class="eyebrow">Alertas</div><ul id="alertas"></ul></section>
    <section><label class="eyebrow" for="notas">Cuaderno</label><textarea id="notas" placeholder="Qué observas. Se guarda con el ensayo."></textarea></section>
  </aside>
</main>

<footer id="tira"></footer>

<script>
const OLLAMA = "http://localhost:11434";
const NUM_CTX = 8192;
const ROMANOS = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX"];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const romano = n => ROMANOS[n - 1] || String(n);
const dos = n => String(n).padStart(2, "0");

// ---------- Análisis (mismo criterio que la página publicada) ----------
const VACIAS = new Set(("a al algo algún alguna ante antes aquí así aun aunque cada como con contra cual cuando de del desde donde dos e el ella ellas ello ellos en entre era eres es esa esas ese eso esos esta está están estas este esto estos estoy fue ha han has hay he la las le les lo los más me mi mí mis muy nada ni no nos o os otra otro para pero poco por porque qué que quien se sea ser si sí sin sino sobre son soy su sus tal también te ti tan tu tú tus un una uno unos unas y ya yo the and you i to of").split(" "));
const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
const contenido = t => t.split(/\s+/).map(norm).filter(w => w.length > 2 && !VACIAS.has(w));
const previoDe = (e, k) => k === 0 ? e.config.semilla : e.mensajes[k - 1].texto;

function originalidad(texto, previo) {
  const set = new Set(contenido(previo)), propias = contenido(texto);
  return propias.length ? Math.round(100 * propias.filter(w => !set.has(w)).length / propias.length) : null;
}
function banderas(e, k) {
  const m = e.mensajes[k], f = [];
  if (k > 0 && m.texto === e.mensajes[k - 1].texto) f.push({ tipo: "copia", txt: `copia exacta del turno ${dos(k)}` });
  else if (k > 1 && m.texto === e.mensajes[k - 2].texto) f.push({ tipo: "repite", txt: "repite su propio mensaje anterior" });
  if (!m.texto.trim()) f.push({ tipo: "vacio", txt: "respuesta vacía: revisa que el modelo exista y responda" });
  const degenerado = m.texto.match(/(^|\s)(\S{1,20})(\s+\2){15,}/);
  if (degenerado) f.push({ tipo: "degenerado", txt: `texto degenerado: repite «${degenerado[2]}» en cadena` });
  if (m.cortado) f.push({ tipo: "corte", txt: `cortado al llegar a ${e.config.num_predict} tokens` });
  if (e.config.modo !== "puro" && new RegExp(`\\b${m.etiqueta}\\b`).test(m.texto)) f.push({ tipo: "nombre", txt: `se llama a sí misma «${m.etiqueta}»` });
  return f;
}
// Markdown mínimo (lo que usan los modelos): títulos, negritas, cursivas, código, listas y separadores.
function mdLinea(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/(^|[^\w])_(?!\s)([^_]+?)_(?![\w])/g, "$1<em>$2</em>");
}
function md(texto) {
  const out = [];
  let lista = null, parrafo = [];
  const cerrarP = () => { if (parrafo.length) { out.push(`<p>${parrafo.join("<br>")}</p>`); parrafo = []; } };
  const cerrarL = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };
  for (const linea of texto.split("\n")) {
    const t = linea.trim();
    let m;
    if (!t) { cerrarP(); cerrarL(); continue; }
    if (/^([-*_])(\s*\1){2,}$/.test(t)) { cerrarP(); cerrarL(); out.push("<hr>"); continue; }
    if ((m = t.match(/^(#{1,6})\s+(.*)$/))) { cerrarP(); cerrarL(); out.push(`<div class="md-h md-h${Math.min(m[1].length, 4)}">${mdLinea(m[2])}</div>`); continue; }
    if ((m = linea.match(/^(\s*)([-*+•]|\d+[.)])\s+(.*)$/))) {
      cerrarP();
      const tipo = /\d/.test(m[2]) ? "ol" : "ul";
      if (lista !== tipo) { cerrarL(); out.push(tipo === "ol" ? `<ol start="${parseInt(m[2])}">` : "<ul>"); lista = tipo; }
      out.push(`<li${m[1].length >= 2 ? ' class="sub"' : ""}>${mdLinea(m[3])}</li>`);
      continue;
    }
    cerrarL();
    parrafo.push(mdLinea(t));
  }
  cerrarP(); cerrarL();
  return out.join("");
}
// Pinta el mensaje con formato; las palabras tomadas del último mensaje de la otra IA llevan el color de la otra.
function pintarEn(el, texto, previo, autor) {
  el.innerHTML = md(texto);
  const set = new Set(contenido(previo)), cls = autor === 0 ? "w-b" : "w-a";
  const copiada = p => { const w = norm(p); return w.length > 2 && !VACIAS.has(w) && set.has(w); };
  const recorrido = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), textos = [];
  while (recorrido.nextNode()) textos.push(recorrido.currentNode);
  for (const nodo of textos) {
    const partes = nodo.nodeValue.split(/(\s+)/);
    if (!partes.some(copiada)) continue;
    const frag = document.createDocumentFragment();
    for (const p of partes) {
      if (!copiada(p)) { frag.append(p); continue; }
      const s = document.createElement("span");
      s.className = cls; s.textContent = p;
      frag.append(s);
    }
    nodo.replaceWith(frag);
  }
}

function renderInstrumentos() {
  const ms = exp ? exp.mensajes : [];

  const W = 264, H = 120, L = 24, R = 6, T = 8, B = 16, n = Math.max(ms.length, exp ? exp.config.turnos : +$("turnos").value, 2);
  const x = i => L + i / (n - 1) * (W - L - R), y = v => T + (1 - v / 100) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Originalidad por turno">`;
  for (const v of [0, 50, 100]) s += `<line class="g" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="${v ? "2 3" : ""}"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`;
  s += `<text x="${L}" y="${H - 3}">turno 1</text><text x="${W - R}" y="${H - 3}" text-anchor="end">${n}</text>`;
  const pts = orig.map((v, i) => v == null ? null : [x(i), y(v), ms[i].autor]).filter(Boolean);
  if (pts.length > 1) s += `<polyline fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>`;

  const val = orig.filter(v => v != null), media = val.length ? Math.round(val.reduce((a, b) => a + b, 0) / val.length) : null;
  $("medidas").innerHTML = [
    [exp ? `${ms.length}/${exp.config.turnos}` : "0", "turnos"],
    [media == null ? "–" : media + "%", "originalidad media"],
    [tok.toLocaleString("es"), "tokens"],
    [seg ? (tok / seg).toFixed(1) : "–", "tokens/s"],
    ...(ms.some(m => m.costo != null) ? [["$" + ms.reduce((a, m) => a + (m.costo || 0), 0).toFixed(4), "coste en OpenRouter"], [ms.filter(m => m.costo != null).length, "mensajes de pago"]] : []),
  ].map(([b, t]) => `<div><b>${b}</b><span>${t}</span></div>`).join("");
  // Alertas
  const al = [];

  $("alertas").innerHTML = al.length ? al.map(a => `<li>${esc(a)}</li>`).join("") : `<li class="nada">Sin alertas</li>`;
}

// ---------- Conversación ----------
// Lee un stream línea a línea y llama a alLinea con cada una.
async function leerLineas(r, alLinea) {
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lineas = buf.split("\n"); buf = lineas.pop();
    lineas.forEach(l => l.trim() && alLinea(l.trim()));
  }
  if (buf.trim()) alLinea(buf.trim());
}

// Genera una respuesta con Ollama o con OpenRouter; alTexto recibe el texto acumulado mientras llega.
async function generar(modelo, messages, signal, alTexto) {
  const c = exp.config;
  let texto = "", tokens = null, cortado = false, costo = null;
  if (esOR(modelo)) {
    const r = await fetch("/api/openrouter/chat", { method: "POST", signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: modelo.slice(3), messages, max_tokens: c.num_predict, temperature: c.temperature }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `OpenRouter respondió ${r.status}`);
    await leerLineas(r, l => {
      if (!l.startsWith("data:")) return;              // comentarios de OpenRouter (": PROCESSING")
      const d = l.slice(5).trim();
      if (d === "[DONE]") return;
      const j = JSON.parse(d);
      if (j.error) throw new Error("OpenRouter: " + (j.error.message || JSON.stringify(j.error)));
      const ch = j.choices?.[0];
      if (ch?.delta?.content) { texto += ch.delta.content; alTexto(texto); }
      if (ch?.finish_reason) cortado = ch.finish_reason === "length";
      if (j.usage) { tokens = j.usage.completion_tokens ?? null; costo = j.usage.cost ?? null; }
    });
  } else {
    const r = await fetch(OLLAMA + "/api/chat", { method: "POST", signal,
      body: JSON.stringify({ model: modelo, messages, stream: true, think: false, keep_alive: "10m",
        options: { num_predict: c.num_predict, temperature: c.temperature, num_ctx: c.num_ctx } }) });
    await leerLineas(r, l => {
      const j = JSON.parse(l);
      if (j.error) throw new Error(j.error);
      if (j.message?.content) { texto += j.message.content; alTexto(texto); }
      if (j.done) { tokens = j.eval_count ?? null; cortado = j.done_reason === "length"; }
    });
  }
  return { texto, tokens, cortado, costo };
}

async function turno() {
  const k = exp.mensajes.length, i = k % 2, ia = exp.config.ias[i];
  const messages = [];
  if (ia.system) messages.push({ role: "system", content: ia.system });
  if (i === 0) messages.push({ role: "user", content: exp.config.semilla });
  for (const m of exp.mensajes) messages.push({ role: m.autor === i ? "assistant" : "user", content: m.texto });

  const seguia = alFondo();
  const nodo = nodoTurno(k), txt = nodo.voz.querySelector(".txt"), prev = previoDe(exp, k), part = $("partitura");
  if (seguia) part.scrollTop = part.scrollHeight;
  nodo.voz.querySelector(".quien").textContent = ia.etiqueta;
  txt.classList.add("cursor");
  ctrl = new AbortController();
  const t0 = performance.now();
  let res;
  try {
    res = await generar(ia.modelo, messages, ctrl.signal, texto => {
      const seguir = alFondo();   // solo sigue el texto si estabas al final; si subiste, te deja leer
      pintarEn(txt, texto, prev, i);
      if (seguir) part.scrollTop = part.scrollHeight;
      botonEnVivo();
    });
  } catch (err) {
    nodo.eje.remove(); nodo.voz.remove();   // el turno a medias no se guarda
    throw err;
  }
  exp.mensajes.push({
    autor: i, etiqueta: ia.etiqueta, modelo: ia.modelo, texto: res.texto.trim(),
    hora: new Date().toISOString(), tokens: res.tokens,
    segundos: +((performance.now() - t0) / 1000).toFixed(1), cortado: res.cortado,
    ...(res.costo != null ? { costo: res.costo } : {}),
  });
  txt.classList.remove("cursor");
  rellenarTurno(nodo, k);
  renderInstrumentos();
  await guardar();
}

function alFondo() {
  const p = $("partitura");
  return p.scrollHeight - p.scrollTop - p.clientHeight < 80;
}
function botonEnVivo() { $("enVivo").hidden = estado === "quieto" || alFondo(); }
$("partitura").addEventListener("scroll", botonEnVivo, { passive: true });
$("enVivo").onclick = () => { const p = $("partitura"); p.scrollTop = p.scrollHeight; botonEnVivo(); };

function copiasSeguidas() {
  let c = 0;
  for (let k = exp.mensajes.length - 1; k > 0 && exp.mensajes[k].texto === exp.mensajes[k - 1].texto; k--) c++;
  return c;
}

async function correr(soloUno) {
  if (estado !== "quieto") return;
  if (!exp) {
    if (!$("modA").value) return setEstado("No hay modelos cargados.");
    exp = nuevoEnsayo();
    bloquearConfig(true);
    renderPartitura();
    await guardar(); await cargarLista();
  }
  exp.config.turnos = +$("turnos").value;
  if (soloUno) exp.config.turnos = Math.max(exp.config.turnos, exp.mensajes.length + 1);
  else if (exp.mensajes.length >= exp.config.turnos) exp.config.turnos = exp.mensajes.length + 10;
  $("turnos").value = exp.config.turnos;
  estado = "corriendo"; pausaPedida = false; botones();
  let motivo = "";
  try {
    do {
      const k = exp.mensajes.length;
      setEstado(`Turno ${k + 1}/${exp.config.turnos} · ${exp.config.ias[k % 2].etiqueta} escribiendo…`);
      await turno();
      if ($("autoParar").checked && copiasSeguidas() >= 2) { motivo = "Auto-parado: 2 copias exactas seguidas."; break; }
    } while (!soloUno && !pausaPedida && exp.mensajes.length < exp.config.turnos);
    if (!motivo) motivo = exp.mensajes.length >= exp.config.turnos ? `Fin: ${exp.mensajes.length} turnos.`
      : pausaPedida ? `En pausa en el turno ${exp.mensajes.length}.` : `Turno ${exp.mensajes.length} listo.`;
  } catch (err) {
    motivo = err.name === "AbortError" ? `Parado. El turno a medias se descartó; hay ${exp.mensajes.length} guardados.` : "Error: " + err.message;
  }
  estado = "quieto"; botones(); botonEnVivo();
  setEstado(motivo + " Guardado.");
  cargarLista();
}

function botones() {
  const q = estado === "quieto";
  $("play").disabled = !q; $("paso").disabled = !q;
  $("pausa").disabled = estado !== "corriendo"; $("parar").disabled = q;
  $("play").textContent = !exp || !exp.mensajes.length ? "▶ Empezar" : exp.mensajes.length >= +$("turnos").value ? "▶ 10 turnos más" : "▶ Seguir";
}

$("play").onclick = () => correr(false);
$("paso").onclick = () => correr(true);
$("pausa").onclick = () => { pausaPedida = true; estado = "pausando"; botones(); setEstado("Pausa al terminar este turno…"); };
$("parar").onclick = () => ctrl?.abort();
$("notas").addEventListener("change", guardar);
$("turnos").addEventListener("input", () => { botones(); if (!exp) renderInstrumentos(); });
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input, textarea, select") || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === " ") { ev.preventDefault(); estado === "quieto" ? correr(false) : estado === "corriendo" && $("pausa").click(); }
  if (ev.key === "ArrowRight") correr(true);
  if (ev.key === "Escape" && estado !== "quieto") $("parar").click();
});

setModo("puro");
renderPartitura(); renderInstrumentos(); botones();
cargarModelos();
cargarLista();
</script>
</body>
</html>
